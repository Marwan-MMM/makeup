<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blush Beauty &mdash; Makeup &amp; Perfumes, Delivered Across Egypt</title>
  <meta name="description" content="Blush Beauty is an Egyptian beauty destination for makeup and fragrance — carefully edited, honestly priced, delivered across Egypt.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F1E4E2'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' fill='%232C2823' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <!-- Category shortcuts -->
    <section class="section-tight" id="section-cats">
      <div class="container">
        <div class="section-head">
          <div>
            <p class="overline" id="home-categories-sub" data-i18n="home_categories_sub"></p>
            <h1 class="display-2" data-i18n="home_categories_title"></h1>
          </div>
        </div>
        <div class="cat-grid" id="cat-grid"></div>
      </div>
    </section>

    <!-- Animated promotional ribbon (settings-controlled, hidden until rendered) -->
    <section id="section-promo-ribbon" hidden>
      <div class="promo-ribbon" id="promo-ribbon">
        <div class="promo-ribbon-track" id="ribbon-track"></div>
      </div>
    </section>

    <!-- Promotional banners (managed in admin) -->
    <section class="section-tight" id="section-banner" hidden>
      <div class="container">
        <div class="banner-stack" id="banner-stack"></div>
      </div>
    </section>

    <!-- Flash sales -->
    <section class="section-tight" id="section-flash" hidden>
      <div class="container">
        <div class="section-head flash-head">
          <div>
            <p class="overline" data-i18n="home_flash_sub"></p>
            <h2 class="display-2" id="flash-title" data-i18n="home_flash_title"></h2>
          </div>
          <a class="text-link" href="shop.html?cat=flash" data-i18n="view_all"></a>
        </div>
        <div class="mt-1 mb-3" id="flash-countdown"></div>
        <div class="h-scroll" id="flash-row"></div>
      </div>
    </section>

    <!-- Featured -->
    <section class="section-tight" id="section-featured" hidden>
      <div class="container">
        <div class="section-head">
          <div>
            <p class="overline" data-i18n="home_featured_sub"></p>
            <h2 class="display-2" id="featured-title" data-i18n="home_featured_title"></h2>
          </div>
        </div>
        <div class="h-scroll" id="featured-row"></div>
      </div>
    </section>

    <!-- Bestsellers -->
    <section class="section-tight" id="section-best" hidden>
      <div class="container">
        <div class="section-head">
          <div>
            <p class="overline" data-i18n="home_best_sub"></p>
            <h2 class="display-2" id="best-title" data-i18n="home_best_title"></h2>
          </div>
          <a class="text-link" href="shop.html?sort=best" data-i18n="view_all"></a>
        </div>
        <div class="h-scroll" id="best-row"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <div id="toast-root"></div>

  <script src="supabase-js.min.js"></script>
  <script src="config.js"></script>
  <script src="translations.js"></script>
  <script src="demo-catalog.js"></script>
  <script src="supabase-client.js"></script>
  <script src="main.js"></script>
  <script src="home.js"></script>
</body>
</html>
