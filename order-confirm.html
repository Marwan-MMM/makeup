<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Confirmed &mdash; Blush Beauty</title>
  <meta name="description" content="Your Blush Beauty order has been received.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F1E4E2'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' fill='%232C2823' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <div class="container section-tight">
      <div class="confirm-wrap" id="confirm-root">
        <div class="confirm-icon" id="confirm-icon"></div>
        <h1 class="display-1" data-i18n="cf_title"></h1>
        <p class="lead mt-1" data-i18n="cf_text"></p>

        <div class="confirm-card" id="confirm-card">
          <div class="kv"><span data-i18n="cf_number"></span><b class="confirm-number" id="cf-number"></b></div>
          <div class="kv"><span data-i18n="cf_date"></span><b id="cf-date"></b></div>
          <div class="kv"><span data-i18n="cf_payment"></span><b id="cf-payment"></b></div>
          <div class="kv"><span data-i18n="cf_total"></span><b id="cf-total"></b></div>
        </div>

        <p class="muted small mt-2" data-i18n="cf_note_code"></p>

        <div class="demo-note" id="cf-demo-note" hidden>
          <span id="cf-demo-icon"></span>
          <span data-i18n="cf_demo_note"></span>
        </div>

        <div class="confirm-actions">
          <a class="btn btn-primary" href="track-order.html" data-i18n="cf_track"></a>
          <a class="btn btn-ghost" href="shop.html" data-i18n="cf_shop"></a>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <div id="toast-root"></div>

  <script src="supabase-js.min.js"></script>
  <script src="config.js"></script>
  <script src="translations.js"></script>
  <script src="demo-catalog.js"></script>
  <script src="supabase-client.js"></script>
  <script src="main.js"></script>
  <script src="confirm.js"></script>
</body>
</html>
